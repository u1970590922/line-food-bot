services:
  - type: web
    name: line-food-bot
    runtime: node
    plan: free
    branch: main
    rootDir: .
    buildCommand: npm install
    startCommand: node src/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: line-food-bot-db
          property: connectionString

databases:
  - name: line-food-bot-db
    plan: free
    databaseName: line_food_bot
    user: line_food_bot_user
